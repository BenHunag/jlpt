<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日檢勇者傳</title>
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="日檢勇者">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: 手機直式單欄遊戲畫面；地圖→村莊→戰鬥，全部用像素視窗 */
:root{
  --bg:#0d0f1a; --win:#05060c; --fg:#f4f4f4; --dim:#9aa0b8; --gold:#ffd84d; --hp:#4fd34f; --low:#ff5a4d; --blue:#5b8cff;
  --f:"DotGothic16","Noto Sans TC",monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
rt{font-size:.5em;color:var(--dim)}
#app{max-width:520px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:12px;min-height:100%}

.win{background:var(--win);border:3px solid var(--fg);border-radius:8px;box-shadow:0 0 0 3px var(--win);padding:12px 14px;position:relative}
.win h3{margin:0 0 6px;font-size:18px;font-weight:400;color:var(--gold)}
.dim{color:var(--dim)}
.gold{color:var(--gold)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{text-align:left;padding:8px 6px 8px 22px;position:relative;font-size:17px}
.menu button::before{content:"";position:absolute;left:4px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:8px solid var(--fg);opacity:0}
.menu button:hover::before,.menu button:focus-visible::before{opacity:1}
.menu button small{display:block;font-size:12px;color:var(--dim)}
.menu button:disabled{color:#555;cursor:default}
.pbtn{border:2px solid var(--fg);border-radius:6px;padding:6px 12px;background:var(--win);font-size:15px;white-space:nowrap}
.pbtn.gold{border-color:var(--gold);color:var(--gold)}
.pbtn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:10px;border:2px solid var(--fg);background:#222;border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--hp);transition:width .35s steps(6)}
.bar.low span{background:var(--low)}
.bar.exp span{background:var(--blue)}
.num{font-variant-numeric:tabular-nums}

/* 標題 */
.title{text-align:center;padding:30px 0 10px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{font-size:clamp(40px,12vw,58px);line-height:1.1;color:var(--gold);text-shadow:4px 4px 0 #8a3a00,8px 8px 0 #000;letter-spacing:.04em}
.logo small{display:block;font-size:15px;color:var(--fg);text-shadow:none;letter-spacing:.3em;margin-top:8px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.title input{font:inherit;background:var(--win);color:var(--fg);border:3px solid var(--fg);border-radius:6px;padding:6px 10px;width:12em;text-align:center}

/* HUD */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.hud .stats{min-width:0}
.hud .line{display:flex;justify-content:space-between;font-size:14px}

/* 地圖 */
.region{border:3px solid var(--fg);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px var(--win)}
.rhead{background:var(--win);padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:3px solid var(--fg)}
.rhead b{font-weight:400;color:var(--gold);font-size:17px}
.rhead span{font-size:13px;color:var(--dim)}
.field{position:relative;background-color:var(--g1);background-image:radial-gradient(var(--g2) 18%,transparent 19%),radial-gradient(var(--g2) 18%,transparent 19%);background-size:24px 24px;background-position:0 0,12px 12px}
.t-kana{--g1:#b8915a;--g2:#a37d4a}
.t-plain{--g1:#3f8a33;--g2:#367a2b}
.t-forest{--g1:#1d5230;--g2:#164326}
.t-castle{--g1:#4f4a66;--g2:#443f59}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:120px}
.nbox{width:48px;height:48px;border:3px solid var(--fg);border-radius:6px;background:var(--win);display:grid;place-items:center;font-size:18px;box-shadow:3px 3px 0 #000}
.node.clear .nbox{border-color:var(--gold);color:var(--gold)}
.node.open .nbox{animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{border-color:var(--gold)}}
.node.lock .nbox{border-color:#666;color:#666;background:#111}
.node.boss .nbox{width:64px;height:64px;border-color:var(--low)}
.node.boss.clear .nbox{border-color:var(--gold)}
.nlabel{font-size:12px;text-align:center;background:rgba(0,0,0,.72);padding:0 6px;border-radius:3px;line-height:1.5;max-width:120px}
.stars{font-size:11px;color:var(--gold);letter-spacing:1px;line-height:1}
.herome{position:absolute;transform:translate(-50%,-100%);pointer-events:none;animation:bob .8s steps(2) infinite}
@keyframes bob{50%{margin-top:-3px}}
.locked{padding:22px 14px;text-align:center;color:var(--dim);background:#111;font-size:14px}

/* 戰鬥 */
.arena{border:3px solid var(--fg);border-radius:8px;box-shadow:0 0 0 3px var(--win);height:210px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16px}
.ehead{position:absolute;top:10px;left:12px;right:12px;background:rgba(0,0,0,.75);border-radius:4px;padding:4px 8px;font-size:14px}
.enemy{position:relative}
.enemy.hit{animation:shake .35s steps(4)}
.enemy.crit{animation:shake .5s steps(6)}
.enemy.kill img{animation:die .6s steps(5) forwards}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes die{to{opacity:0;transform:scaleY(.2) translateY(40px)}}
.pop{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:28px;color:var(--fg);text-shadow:2px 2px 0 #000;animation:pop .8s steps(6) forwards;white-space:nowrap}
.pop.c{color:var(--gold)}
@keyframes pop{to{top:-30px;opacity:0}}
.flash{position:fixed;inset:0;background:var(--low);pointer-events:none;animation:flash .35s steps(3) forwards;z-index:5}
@keyframes flash{from{opacity:.55}to{opacity:0}}
.shakeall{animation:shake .3s steps(4)}
.qkind{font-size:12px;color:var(--gold);letter-spacing:.1em}
.qp{font-size:clamp(22px,6vw,28px);line-height:1.9;margin:2px 0;overflow-wrap:anywhere}
.qp.zh{font-size:clamp(20px,5.4vw,24px)}
.qhint{font-size:14px;color:var(--dim);margin-bottom:8px;min-height:1.6em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--fg);border-radius:6px;padding:8px 10px;text-align:left;font-size:17px;line-height:1.7;min-height:48px;background:#0b0d18}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{border-color:var(--hp);color:var(--hp)}
.opt.wrong{border-color:var(--low);color:var(--low)}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.log{font-size:15px;min-height:3.2em}
.log p{margin:0}
.items{display:flex;gap:6px;flex-wrap:wrap}
.items .pbtn{font-size:13px;padding:4px 8px}

/* 訓練所 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid #555;border-radius:6px;padding:4px 12px;font-size:15px;color:var(--dim)}
.tabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed #333}
.vrow:first-child{border-top:0}
.vw{font-size:21px;line-height:1.6}
.vm{font-size:14px;font-family:"Noto Sans TC",var(--f)}
.vrow .row{gap:6px;flex-wrap:nowrap}
.mini{border:2px solid #666;border-radius:5px;padding:2px 8px;font-size:13px;white-space:nowrap}
.mini.on{border-color:var(--hp);color:var(--hp)}
.gblock{padding:10px 0;border-top:1px dashed #333}
.gblock:first-child{border-top:0}
.gp{color:var(--gold);font-size:18px}
.gex{font-size:18px;line-height:2}
.zh{font-family:"Noto Sans TC",var(--f)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kc{border:2px solid #444;border-radius:6px;padding:8px}
.kc .k{font-size:44px;line-height:1.1}
.kc div{font-size:13px}
.kchart{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.kchart button{border:2px solid #444;border-radius:5px;padding:4px 0;display:flex;flex-direction:column;align-items:center}
.kchart .k{font-size:24px;line-height:1.2}
.kchart .r{font-size:11px;color:var(--dim)}
.kchart .blank{visibility:hidden}

/* 圖鑑・商店 */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.card{border:2px solid #444;border-radius:6px;padding:6px 8px;text-align:left;min-height:62px}
.card.got{border-color:var(--gold)}
.card .w{font-size:18px;line-height:1.3}
.card .m{font-size:12px;color:var(--dim);font-family:"Noto Sans TC",var(--f)}
.shop{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px dashed #333;padding-top:10px}
.item:first-child{border-top:0;padding-top:0}
.item small{display:block;color:var(--dim);font-size:13px}
.result{text-align:center}
.big{font-size:40px;color:var(--gold);text-shadow:3px 3px 0 #8a3a00}
.big.lose{color:var(--low);text-shadow:3px 3px 0 #3a0b0b}
.rstars{font-size:30px;color:var(--gold);letter-spacing:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
const LEVELS={
  n5:{name:'N5',title:'入門',desc:'能讀懂以假名和基本漢字寫成的簡單句子。',words:'約 800',kanji:'約 100',pass:'80/180',units:[
    {id:'n5-1',t:'自我介紹',d:'學會「我是〜」「我不是〜」和問句，就能做最簡單的自我介紹。',
     v:[['私','わたし','我'],['あなた','あなた','你'],['先生','せんせい','老師'],['学生','がくせい','學生'],['友達','ともだち','朋友'],['名前','なまえ','名字'],['日本','にほん','日本'],['会社員','かいしゃいん','上班族']],
     g:[{p:'AはBです',m:'A 是 B（肯定句）',ex:'私{わたし}は学生{がくせい}です。',zh:'我是學生。',q:'私{わたし}（　）学生{がくせい}です。',t:'我是學生。',a:'は',d:['を','に','で']},
        {p:'AはBではありません',m:'A 不是 B（否定句）',ex:'私{わたし}は先生{せんせい}ではありません。',zh:'我不是老師。',q:'田中{たなか}さんは先生{せんせい}（　）。',t:'田中先生不是老師。',a:'ではありません',d:['がありません','をしません','にいません']},
        {p:'〜か',m:'放在句尾變成疑問句',ex:'あなたは日本人{にほんじん}ですか。',zh:'你是日本人嗎？',q:'これは本{ほん}です（　）。',t:'這是書嗎？',a:'か',d:['を','は','の']}],
     k:[['人','ジン・ニン','ひと','人','日本人','にほんじん','日本人'],['日','ニチ・ジツ','ひ・か','日、太陽','毎日','まいにち','每天'],['本','ホン','もと','書、根本','日本','にほん','日本'],['学','ガク','まな(ぶ)','學習','学生','がくせい','學生'],['生','セイ・ショウ','い(きる)・う(まれる)','生命、出生','先生','せんせい','老師']]},
    {id:'n5-2',t:'這個・那個',d:'用こ・そ・あ・ど指東西，並學會「的」和「也」。',
     v:[['これ','これ','這個'],['それ','それ','那個（靠近對方）'],['あれ','あれ','那個（離兩人都遠）'],['どこ','どこ','哪裡'],['本','ほん','書'],['鞄','かばん','包包'],['傘','かさ','雨傘'],['時計','とけい','時鐘、手錶']],
     g:[{p:'これ／それ／あれは〜です',m:'這／那／那（遠）是〜',ex:'それは私{わたし}の傘{かさ}です。',zh:'那是我的傘。',q:'（　）は時計{とけい}です。',t:'這是時鐘。',a:'これ',d:['それ','あれ','どれ']},
        {p:'AのB',m:'A 的 B（所屬）',ex:'これは私{わたし}の本{ほん}です。',zh:'這是我的書。',q:'これは先生{せんせい}（　）鞄{かばん}です。',t:'這是老師的包包。',a:'の',d:['は','を','が']},
        {p:'〜も',m:'也〜',ex:'それも私{わたし}の本{ほん}です。',zh:'那也是我的書。',q:'私{わたし}（　）学生{がくせい}です。',t:'我也是學生。',a:'も',d:['の','を','で']}],
     k:[['山','サン','やま','山','富士山','ふじさん','富士山'],['川','セン','かわ','河川','小川','おがわ','小河'],['田','デン','た','田','田中','たなか','田中（姓氏）'],['口','コウ','くち','嘴、出入口','入口','いりぐち','入口'],['目','モク','め','眼睛','一つ目','ひとつめ','第一個']]},
    {id:'n5-3',t:'數字與時間',d:'說出時間、從幾點到幾點，以及在某個時間做某事。',
     v:[['一つ','ひとつ','一個'],['何時','なんじ','幾點'],['今','いま','現在'],['毎日','まいにち','每天'],['朝','あさ','早上'],['晩','ばん','晚上'],['月曜日','げつようび','星期一'],['円','えん','日圓']],
     g:[{p:'〜時〜分です',m:'〜點〜分',ex:'今{いま}は三時{さんじ}十分{じゅっぷん}です。',zh:'現在是三點十分。',q:'今{いま}は七（　）です。',t:'現在是七點。',a:'時{じ}',d:['分{ふん}','円{えん}','日{にち}']},
        {p:'〜から〜まで',m:'從〜到〜',ex:'九時{くじ}から五時{ごじ}まで働{はたら}きます。',zh:'從九點工作到五點。',q:'月曜日{げつようび}（　）金曜日{きんようび}まで働{はたら}きます。',t:'從星期一工作到星期五。',a:'から',d:['まで','に','へ']},
        {p:'時間＋に',m:'在某個時間點（做某事）',ex:'毎朝{まいあさ}七時{しちじ}に起{お}きます。',zh:'每天早上七點起床。',q:'十時{じゅうじ}（　）寝{ね}ます。',t:'十點睡覺。',a:'に',d:['を','が','で']}],
     k:[['一','イチ','ひと(つ)','一','一つ','ひとつ','一個'],['二','ニ','ふた(つ)','二','二人','ふたり','兩個人'],['三','サン','みっ(つ)','三','三時','さんじ','三點'],['十','ジュウ','とお','十','十日','とおか','十號、十天'],['円','エン','まる(い)','日圓、圓','百円','ひゃくえん','一百日圓']]},
    {id:'n5-4',t:'每天做的事',d:'動詞的ます形：做、不做、做了，以及「を」和「へ」。',

     g:[{p:'〜ます／〜ません',m:'（禮貌）做／不做',ex:'毎朝{まいあさ}コーヒーを飲{の}みます。',zh:'每天早上喝咖啡。',q:'私{わたし}はお酒{さけ}を飲{の}み（　）。',t:'我不喝酒。',a:'ません',d:['ます','ました','たい']},
        {p:'〜ました／〜ませんでした',m:'（禮貌）做了／沒做',ex:'昨日{きのう}映画{えいが}を見{み}ました。',zh:'昨天看了電影。',q:'昨日{きのう}、パンを食{た}べ（　）。',t:'昨天吃了麵包。',a:'ました',d:['ます','ません','たい']},
        {p:'〜を＋動詞',m:'標示動作的對象',ex:'毎日{まいにち}パンを食{た}べます。',zh:'每天吃麵包。',q:'水{みず}（　）飲{の}みます。',t:'喝水。',a:'を',d:['に','は','へ']},
        {p:'場所＋へ行きます',m:'往〜去（方向）',ex:'明日{あした}、学校{がっこう}へ行{い}きます。',zh:'明天去學校。',q:'東京{とうきょう}（　）行{い}きます。',t:'去東京。',a:'へ',d:['を','で','が']}],
     k:[['食','ショク','た(べる)','吃','食事','しょくじ','用餐'],['飲','イン','の(む)','喝','飲み物','のみもの','飲料'],['行','コウ','い(く)','去','銀行','ぎんこう','銀行'],['来','ライ','く(る)','來','来年','らいねん','明年'],['見','ケン','み(る)','看','花見','はなみ','賞花']]},
    {id:'n5-5',t:'形容東西',d:'い形容詞和な形容詞的用法與否定。',
     v:[['高い','たかい','高、貴'],['安い','やすい','便宜'],['大きい','おおきい','大'],['小さい','ちいさい','小'],['新しい','あたらしい','新'],['古い','ふるい','舊'],['静か','しずか','安靜'],['元気','げんき','有精神']],
     g:[{p:'い形容詞＋です',m:'描述性質（い結尾）',ex:'この鞄{かばん}は高{たか}いです。',zh:'這個包包很貴。',q:'この時計{とけい}は（　）です。',t:'這支錶很便宜。',a:'安{やす}い',d:['高{たか}い','古{ふる}い','静{しず}か']},
        {p:'な形容詞＋な＋名詞',m:'な形容詞接名詞時要加な',ex:'ここは静{しず}かな町{まち}です。',zh:'這裡是安靜的城鎮。',q:'静{しず}か（　）部屋{へや}です。',t:'安靜的房間。',a:'な',d:['い','の','を']},
        {p:'〜くないです',m:'い形容詞的否定',ex:'この本{ほん}は高{たか}くないです。',zh:'這本書不貴。',q:'今日{きょう}は寒{さむ}（　）です。',t:'今天不冷。',a:'くない',d:['いない','じゃない','かった']}],
     k:[['高','コウ','たか(い)','高、貴','高校','こうこう','高中'],['安','アン','やす(い)','便宜、安定','安心','あんしん','安心'],['新','シン','あたら(しい)','新','新聞','しんぶん','報紙'],['古','コ','ふる(い)','舊','中古','ちゅうこ','二手'],['気','キ・ケ','—','氣','電気','でんき','電燈、電力']]},

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  const seq={sel:[[660,.05]],hit:[[880,.06],[1320,.08]],crit:[[880,.05],[1320,.05],[1760,.12]],hurt:[[220,.08],[140,.14]],win:[[523,.1],[659,.1],[784,.1],[1046,.25]],lv:[[659,.08],[784,.08],[988,.08],[1318,.3]],lose:[[392,.18],[330,.18],[262,.4]],buy:[[988,.06],[1318,.1]]}[name]||[];
  let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}

function stagesOf(ri){const r=REG[ri];const s=r.stages.map(x=>({id:x.id,t:x.t,d:x.d,kana:x.kana,unit:x.kana?null:x}));if(r.boss)s.push({id:r.id+'-boss',t:'魔王・'+r.boss[0],d:`${r.tag} 全範圍的題目都會出現。打倒魔王才能前往下一章。`,boss:true});return s}

function unitQs(u,lvKey){
  const pool=LEVELS[lvKey].units, allV=pool.flatMap(x=>x.v), allK=pool.flatMap(x=>x.k);
  const pick=(arr,c)=>shuffle([...new Set(arr.filter(x=>x!==c))]).slice(0,3), qs=[];
  u.v.forEach((v,j)=>{const wid=u.id+'-'+j;
    qs.push({kind:'單字・選意思',jp:word(v[0],v[1]),speak:v[1],a:v[2],opts:shuffle([v[2],...pick(allV.map(x=>x[2]),v[2])]),wid,note:`${v[0]}（${v[1]}）＝${v[2]}`});
    qs.push({kind:'單字・選日文',zhp:v[2],a:v[0],opts:shuffle([v[0],...pick(allV.map(x=>x[0]),v[0])]),wid,note:`${v[2]}＝${v[0]}（${v[1]}）`})});
  u.k.forEach(k=>qs.push({kind:'漢字・選讀音',jp:esc(k[4]),speak:k[5],hint:'意思：'+k[6],a:k[5],opts:shuffle([k[5],...pick(allK.map(x=>x[5]),k[5])]),note:`${k[4]} 讀作 ${k[5]}`}));
  u.g.forEach(g=>{qs.push({kind:'文法・填空',jp:ruby(g.q),hint:g.t,a:g.a,opts:shuffle([g.a,...g.d]),rubyOpts:true,note:`句型：${g.p}（${g.m}）`});qs.push({kind:'文法・填空',jp:ruby(g.q),hint:g.t,a:g.a,opts:shuffle([g.a,...g.d]),rubyOpts:true,note:`句型：${g.p}（${g.m}）`})});
  return qs;
}
function kanaQs(set){const S=set==='hira'?HIRA:KATA, idx=S.map((k,j)=>k==='・'?-1:j).filter(j=>j>=0), all=idx.map(j=>ROMA[j]);
  return idx.map(j=>({kind:'假名・選讀音',jp:`<span style="font-size:1.8em">${S[j]}</span>`,speak:S[j],a:ROMA[j],opts:shuffle([ROMA[j],...shuffle(all.filter(r=>r!==ROMA[j])).slice(0,3)]),note:`${S[j]} ＝ ${ROMA[j]}`}))}
function srcFor(ri,st){const r=REG[ri];if(st.kana)return kanaQs(st.kana);if(st.boss)return r.stages.flatMap(u=>unitQs(u,r.id));return unitQs(st.unit,r.id)}

function startBattle(){
  const ri=UI.ri,si=UI.si,r=REG[ri],st=stagesOf(ri)[si],b=r.base,scale=1+si*.08;
  const mk=(m,boss)=>({name:m[0],shape:m[1],pal:m[2],max:Math.round(b.hp*scale*(boss?6:1)),dmg:Math.round(b.dmg*(boss?1.4:1)),exp:b.exp*(boss?8:1),gold:b.gold*(boss?10:1),boss});
  const en=st.boss?[mk(r.boss,true)]:Array.from({length:4},()=>mk(r.mons[Math.floor(Math.random()*r.mons.length)]));
  en.forEach(e=>e.hp=e.max);
  B={ri,si,st,src:srcFor(ri,st),queue:[],en,ei:0,hp:maxHp(),max:maxHp(),streak:0,charm:false,phase:'ask',chosen:null,removed:[],gExp:0,gGold:0,lvUps:0,log:[`${en[0].name} 出現了！`],fx:null,killed:false};
  B.q=nextQ();UI.screen='battle';render();
}
function nextQ(){if(!B.queue.length)B.queue=shuffle(B.src);return B.queue.pop()}
function gain(exp,gold){B.gExp+=exp;B.gGold+=gold;G.exp+=exp;G.gold+=gold;
  while(G.exp>=need(G.lv)){G.exp-=need(G.lv);G.lv++;B.lvUps++;B.log.push(`等級提升！${G.name} 升到 Lv ${G.lv}！`);sfx('lv');B.max=maxHp();}}
function answer(j){
  if(B.phase!=='ask')return;
  const q=B.q,e=B.en[B.ei],ok=q.opts[j]===q.a;B.chosen=j;B.phase='answered';B.log=[];
  if(ok){B.streak++;const crit=B.streak>=3&&B.streak%3===0, d=Math.round(atk()*(crit?2:1)*(0.9+Math.random()*.2));
    e.hp=Math.max(0,e.hp-d);if(q.wid)G.col[q.wid]=1;
    B.log.push(crit?`會心一擊！對 ${e.name} 造成 ${d} 點傷害！`:`${G.name} 的攻擊！對 ${e.name} 造成 ${d} 點傷害。`);
    B.fx={t:crit?'crit':'hit',d};sfx(crit?'crit':'hit');
    if(e.hp<=0){B.killed=true;B.fx.kill=true;B.log.push(`打倒了 ${e.name}！獲得 ${e.exp} 經驗值、${e.gold} 金幣。`);gain(e.exp,e.gold)}
  }else{B.streak=0;
    if(B.charm){B.charm=false;B.log.push(`${e.name} 的攻擊！護身符擋下了傷害。`);}
    else{const d=Math.round(e.dmg*(0.9+Math.random()*.2));B.hp=Math.max(0,B.hp-d);B.log.push(`${e.name} 的攻擊！受到 ${d} 點傷害。`);B.fx={t:'hurt'};sfx('hurt')}
    if(B.hp<=0)B.log.push(`${G.name} 倒下了……`);
  }
  if(q.speak)setTimeout(()=>speak(q.speak),250);
  save();render();
}
function cont(){
  if(B.hp<=0){finish(false);return}
  if(B.killed){B.ei++;B.killed=false;if(B.ei>=B.en.length){finish(true);return}B.log=[`${B.en[B.ei].name} 出現了！`]}else B.log=[];
  B.q=nextQ();B.phase='ask';B.chosen=null;B.removed=[];B.fx=null;render();
}
function useItem(k){
  if(!G.items[k]||B.phase!=='ask')return;
  if(k==='herb'){if(B.hp>=B.max)return;const h=Math.ceil(B.max/2);B.hp=Math.min(B.max,B.hp+h);B.log=[`使用藥草，回復了 ${h} 點 HP。`]}
  if(k==='scroll'){if(B.removed.length)return;B.removed=shuffle(B.q.opts.map((o,i)=>o===B.q.a?-1:i).filter(i=>i>=0)).slice(0,2);B.log=['提示卷軸發光了！刪掉兩個錯誤選項。']}
  if(k==='charm'){if(B.charm)return;B.charm=true;B.log=['戴上了護身符。下一次答錯不會受傷。']}
  G.items[k]--;B.fx=null;sfx('sel');save();render();
}
function finish(win){
  const st=B.st,r=REG[B.ri];let stars=0,bonus=0,first=false,chapter=null;
  if(win){stars=B.hp/B.max>=.7?3:B.hp/B.max>=.35?2:1;first=!G.clear[st.id];
    if(first&&!st.boss){bonus=r.base.gold*5;G.gold+=bonus}
    G.clear[st.id]=Math.max(G.clear[st.id]||0,stars);
    if(st.boss&&first){const nx=REG[B.ri+1];chapter=nx?`${nx.name}「${nx.land}」解鎖了！`:'你打倒了所有魔王，成為真正的日檢勇者！'}
    sfx('win');
  }else sfx('lose');
  B.result={win,stars,bonus,first,chapter};B.phase='end';UI.screen='result';save();render();
}

    ${st.map((s,si)=>{const o=stageOpen(ri,si),c=G.clear[s.id],cls=[c?'clear':o?'open':'lock',s.boss?'boss':''].join(' '),[x,y]=pts[si];
      const inner=s.boss?(o?sprite(r.boss[1],PAL[r.boss[2]],44):'?'):(c?'★':o?si+1:'?');
      return `<button class="node ${cls}" style="left:${x}%;top:${y}px" data-stage="${ri},${si}" ${o?'':'disabled'} aria-label="${esc(s.t)}"><span class="nbox">${inner}</span><span class="nlabel">${esc(s.t)}</span>${c?`<span class="stars">${'★'.repeat(c)}${'☆'.repeat(3-c)}</span>`:''}</button>`+
        (cur&&cur[0]===ri&&cur[1]===si?`<span class="herome" style="left:calc(${x}% ${x>60?'- 46px':'+ 46px'});top:${y-6}px">${sprite('hero',PAL.hero,32)}</span>`:'');}).join('')}
    </div></div>`;
  });
  return html;
}
function vVillage(){
  const r=REG[UI.ri],st=stagesOf(UI.ri)[UI.si],c=G.clear[st.id];
  const foe=st.boss?r.boss:r.mons[UI.si%r.mons.length];
  return `<div class="win"><div class="spread"><span class="dim" style="font-size:13px">${r.name}・${r.land}　${st.boss?'魔王關':'第 '+(UI.si+1)+' 關'}</span><span class="gold">${c?'★'.repeat(c)+'☆'.repeat(3-c):''}</span></div>
  <div class="row" style="flex-wrap:nowrap;gap:14px;margin-top:6px">${sprite(foe[1],PAL[foe[2]],st.boss?80:56)}<div><h3 style="margin:0">${esc(st.t)}</h3><div class="dim zh" style="font-size:14px">${esc(st.d||'')}</div></div></div></div>
  <div class="win menu">
   <button data-act="fight">出發戰鬥<small>${st.boss?`魔王 ${r.boss[0]} 在等著你`:'會遇到 4 隻怪物'}</small></button>
   <button data-go="train">訓練所<small>${st.kana?'看假名表':st.boss?'複習本章所有內容':'看單字・文法・漢字'}</small></button>
   <button data-go="map">返回地圖</button></div>
  <div class="win" style="font-size:14px"><span class="dim">你的狀態</span>　Lv ${G.lv}・HP ${maxHp()}・攻擊 ${atk()}<br><span class="dim">道具</span>　${Object.keys(ITEMS).map(k=>`${ITEMS[k].n}×${G.items[k]||0}`).join('　')}</div>`;
}
function vTrain(){
  const r=REG[UI.ri],st=stagesOf(UI.ri)[UI.si];
  let body='';
  if(st.kana){const S=st.kana==='hira'?HIRA:KATA;body=`<div class="kchart">${S.map((k,j)=>k==='・'?'<span class="blank"></span>':`<button data-speak="${k}"><span class="k">${k}</span><span class="r">${ROMA[j]}</span></button>`).join('')}</div>`}
  else{
    const units=st.boss?r.stages:[st.unit], tabs=[['vocab','單字'],['grammar','文法'],['kanji','漢字']];
    body=`<div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${UI.tab===t[0]}">${t[1]}</button>`).join('')}</div><div style="margin-top:10px">`;
    units.forEach(u=>{
      if(st.boss)body+=`<div class="gold" style="margin-top:10px;font-size:14px">── ${esc(u.t)} ──</div>`;
      if(UI.tab==='vocab')body+=u.v.map((v,j)=>{const id=u.id+'-'+j,got=G.col[id];return `<div class="vrow"><div class="vw">${word(v[0],v[1])}</div><div class="vm">${esc(v[2])}</div><div class="row"><button class="mini" data-speak="${esc(v[1])}">聽</button><button class="mini ${got?'on':''}" data-col="${id}">${got?'已收集':'收集'}</button></div></div>`}).join('');
      if(UI.tab==='grammar')body+=u.g.map(g=>`<div class="gblock"><div class="gp">${esc(g.p)}</div><div class="dim zh" style="font-size:14px">${esc(g.m)}</div><div class="spread" style="flex-wrap:nowrap"><div class="gex">${ruby(g.ex)}</div><button class="mini" data-speak="${esc(plain(g.ex))}">聽</button></div><div class="zh" style="font-size:14px">${esc(g.zh)}</div></div>`).join('');
      if(UI.tab==='kanji')body+=`<div class="kgrid">${u.k.map(k=>`<div class="kc"><div class="k">${k[0]}</div><div><span class="dim">音</span> ${esc(k[1])}</div><div><span class="dim">訓</span> ${esc(k[2])}</div><div class="zh">${esc(k[3])}</div><div style="margin-top:4px;font-size:15px">${word(k[4],k[5])} <span class="dim zh" style="font-size:12px">${esc(k[6])}</span></div></div>`).join('')}</div>`;
    });
    body+='</div>';
  }
  return `<div class="win"><div class="spread"><h3 style="margin:0">訓練所・${esc(st.t)}</h3><button class="pbtn" data-go="village">返回</button></div>
  <p class="dim zh" style="font-size:13px;margin:4px 0 10px">${st.kana?'點假名可以聽發音。':'按「收集」把單字放進圖鑑；戰鬥中答對單字題也會自動收集。'}</p>${body}</div>
  <button class="pbtn gold" data-act="fight" style="align-self:center;font-size:18px;padding:8px 24px">出發戰鬥</button>`;
}
function vBattle(){
  const e=B.en[B.ei],q=B.q,r=REG[B.ri],ep=e.hp/e.max*100,hp=B.hp/B.max*100,ans=B.phase==='answered';
  const fx=B.fx||{};
  const opts=q.opts.map((o,j)=>{let c='opt';if(B.removed.includes(j))c+=' gone';if(ans){if(o===q.a)c+=' right';else if(j===B.chosen)c+=' wrong'}return `<button class="${c}" data-opt="${j}" ${ans||B.removed.includes(j)?'disabled':''}>${q.rubyOpts?ruby(o):esc(o)}</button>`}).join('');
  return `<div class="arena field t-${r.theme}"><div class="ehead"><div class="spread"><span>${e.name}${e.boss?' <span style="color:var(--low)">BOSS</span>':''}</span><span class="dim num">${B.ei+1}/${B.en.length}</span></div><div class="bar ${ep<30?'low':''}"><span style="width:${ep}%"></span></div></div>
   <div class="enemy ${fx.t==='hit'||fx.t==='crit'?fx.t:''} ${fx.kill?'kill':''}">${sprite(e.shape,PAL[e.pal],e.boss?160:120)}${fx.d?`<span class="pop ${fx.t==='crit'?'c':''}">${fx.d}</span>`:''}</div></div>
  <div class="win ${fx.t==='hurt'?'shakeall':''}"><div class="spread" style="font-size:14px"><span>${esc(G.name)} Lv ${G.lv}${B.charm?' <span class="gold">護</span>':''}${B.streak>=2?` <span class="gold">連擊 ${B.streak}</span>`:''}</span><span class="num">HP ${B.hp}/${B.max}</span></div><div class="bar ${hp<30?'low':''}"><span style="width:${hp}%"></span></div>
   <div class="items" style="margin-top:8px">${Object.keys(ITEMS).map(k=>`<button class="pbtn" data-item="${k}" ${!G.items[k]||ans?'disabled':''}>${ITEMS[k].n}×${G.items[k]||0}</button>`).join('')}<button class="pbtn" data-act="flee" style="margin-left:auto">逃跑</button></div></div>
  <div class="win"><div class="qkind">${q.kind}</div>
   ${q.zhp?`<div class="qp zh">${esc(q.zhp)}</div>`:`<div class="qp">${q.jp}</div>`}
   <div class="qhint zh">${esc(q.hint||'')}</div><div class="opts">${opts}</div></div>
  <div class="win log">${B.log.map(l=>`<p>${esc(l)}</p>`).join('')}${ans?`<p class="dim zh" style="font-size:13px;margin-top:4px">${ruby(q.note)}</p><div style="text-align:right;margin-top:6px"><button class="pbtn gold" data-act="cont">▶ 繼續</button></div>`:(B.log.length?'':'<p class="dim">要怎麼回答呢？</p>')}</div>`;
}
function vResult(){
  const R=B.result,st=B.st;
  if(R.win)return `<div class="win result"><div class="big">勝利！</div><div class="rstars">${'★'.repeat(R.stars)}${'☆'.repeat(3-R.stars)}</div><p>${esc(st.t)} 過關</p>
   <p class="num">經驗值 +${B.gExp}　金幣 +${B.gGold}${R.bonus?`<br><span class="gold">首次過關獎勵 +${R.bonus} G</span>`:''}${B.lvUps?`<br><span class="gold">等級提升到 Lv ${G.lv}！</span>`:''}</p>
   ${R.chapter?`<p class="gold">${esc(R.chapter)}</p>`:''}
   <div class="row" style="justify-content:center"><button class="pbtn" data-act="fight">再挑戰</button><button class="pbtn gold" data-go="map">返回地圖</button></div></div>`;
  return `<div class="win result"><div class="big lose">全滅了……</div><p>${esc(st.t)} 挑戰失敗</p><p class="dim num">這次獲得的經驗值 +${B.gExp}、金幣 +${B.gGold} 會保留</p><p class="zh" style="font-size:14px">到訓練所複習，或去商店買藥草再來挑戰吧！</p>
   <div class="row" style="justify-content:center"><button class="pbtn" data-go="train">訓練所</button><button class="pbtn" data-go="shop">商店</button><button class="pbtn gold" data-act="fight">再挑戰</button></div></div>`;
}
function vShop(){
  return `<div class="win"><div class="spread"><h3 style="margin:0">道具店</h3><span class="gold num">${G.gold} G</span></div><p class="dim zh" style="font-size:13px;margin:4px 0 12px">歡迎光臨！要買點什麼嗎？（いらっしゃいませ）</p>
  <div class="shop">${Object.keys(ITEMS).map(k=>`<div class="item"><div>${ITEMS[k].n}　<span class="dim">持有 ${G.items[k]||0}</span><small class="zh">${ITEMS[k].d}</small></div><button class="pbtn gold" data-buy="${k}" ${G.gold<ITEMS[k].p?'disabled':''}>${ITEMS[k].p} G</button></div>`).join('')}</div>
  ${UI.msg?`<p class="gold" style="margin:12px 0 0">${esc(UI.msg)}</p>`:''}</div>
  <button class="pbtn" data-back style="align-self:center">返回</button>`;
}
function vBook(){
  const lv=UI.book,units=LEVELS[lv].units,all=units.flatMap(u=>u.v.map((v,j)=>[u.id+'-'+j,v])),got=all.filter(x=>G.col[x[0]]).length;
  return `<div class="win"><div class="spread"><h3 style="margin:0">單字圖鑑</h3><span class="num">${got}/${all.length}</span></div>
  <div class="tabs" style="margin:8px 0 10px">${['n5','n4','n3'].map(k=>`<button data-book="${k}" aria-selected="${UI.book===k}">${k.toUpperCase()}</button>`).join('')}</div>
  <div class="book">${all.map(([id,v])=>G.col[id]?`<button class="card got" data-speak="${esc(v[1])}"><div class="w">${word(v[0],v[1])}</div><div class="m">${esc(v[2])}</div></button>`:`<div class="card"><div class="w dim">？？？</div></div>`).join('')}</div></div>
  <button class="pbtn" data-back style="align-self:center">返回</button>`;
}

let prev='map';
function render(){
  const v={title:vTitle,map:vMap,village:vVillage,train:vTrain,battle:vBattle,result:vResult,shop:vShop,book:vBook}[UI.screen];
  $('#app').innerHTML=v();
  if(B&&B.fx&&B.fx.t==='hurt'&&UI.screen==='battle'){$('#fx').innerHTML='<div class="flash"></div>';setTimeout(()=>$('#fx').innerHTML='',400)}
  if(B&&B.fx)B.fx={...B.fx,t:null,d:null}; // 動畫只播一次
}
function go(s){if(s==='shop'||s==='book'){if(UI.screen!=='shop'&&UI.screen!=='book')prev=UI.screen;UI.msg=''}UI.screen=s;render();window.scrollTo({top:0})}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
  if(d.speak){speak(d.speak);return}
  if(d.act==='newgame'){G.name=($('#nm').value||'勇者').trim().slice(0,8)||'勇者';save();sfx('win');go('map');return}
  if(d.act==='enter'){sfx('sel');go('map');return}
  if(d.go){sfx('sel');if(d.go==='map')B=null;go(d.go);return}
  if(d.back!==undefined){sfx('sel');go(prev);return}
  if(d.set){G[d.set]=!G[d.set];save();render();return}
  if(d.stage){const[ri,si]=d.stage.split(',').map(Number);UI.ri=ri;UI.si=si;UI.tab='vocab';sfx('sel');go('village');return}
  if(d.tab){UI.tab=d.tab;render();return}
  if(d.book){UI.book=d.book;render();return}
  if(d.col){if(G.col[d.col])delete G.col[d.col];else G.col[d.col]=1;save();render();return}
  if(d.act==='fight'){startBattle();window.scrollTo({top:0});return}
  if(d.opt!==undefined){answer(+d.opt);return}
  if(d.act==='cont'){cont();return}
  if(d.item){useItem(d.item);return}
  if(d.act==='flee'){B=null;sfx('sel');go('village');return}
  if(d.buy){const it=ITEMS[d.buy];if(G.gold>=it.p){G.gold-=it.p;G.items[d.buy]=(G.items[d.buy]||0)+1;UI.msg=`買了${it.n}！謝謝惠顧。`;sfx('buy');save();render()}return}
});
document.addEventListener('keydown',e=>{if(UI.screen==='title'&&e.key==='Enter'&&$('#nm'))$('[data-act=newgame]').click()});
try{speechSynthesis.getVoices()}catch(e){}
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
